# Optional drop-in: push the copy off the box as soon as it has been made.
# Install with
#   install -D deploy/shift-central-backup-pbs.conf /etc/systemd/system/shift-central-backup.service.d/pbs.conf
# only once shift-central-pbs.service is set up (README, "Off-site backup").
[Unit]
OnSuccess=shift-central-pbs.service
